# Entegrasyon testleri icin tek kullanimlik Postgres.
#   docker compose -f docker-compose.test.yml up -d
# Port 5433 secildi ki yerelde calisan bir Postgres (5432) ile catismasin.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: keks
      POSTGRES_PASSWORD: keks
      POSTGRES_DB: keks_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keks -d keks_test"]
      interval: 2s
      timeout: 3s
      retries: 30
