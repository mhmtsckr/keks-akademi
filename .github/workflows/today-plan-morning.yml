name: Morning Today Plans

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  generate:
    name: Generate student daily plans
    runs-on: ubuntu-latest
    steps:
      - name: Request GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=keks-today-plan")"
          TOKEN="$(printf '%s' "$RESPONSE" | jq -r '.value')"
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          printf 'token=%s\n' "$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Generate KEKS morning plans
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $OIDC_TOKEN" \
            --header "Content-Type: application/json" \
            https://keks-akademi.vercel.app/api/internal/today-plan/generate
