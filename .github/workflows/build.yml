name: Build Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
  AUTH_SECRET: build-check-secret-not-for-production-1234567890
  APP_URL: http://localhost:3000
  ADMIN_EMAIL: keksakademi@gmail.com
  REPORT_RECIPIENT: keksakademi@gmail.com
  TEST_PRICE_KURUS: "35000"
  PAYTR_TEST_MODE: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate
      # Vitest tip kontrolu yapmaz; tsc ayri calismali.
      - run: npx tsc --noEmit
      - run: npm run test:coverage

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate
      - run: npm run build
