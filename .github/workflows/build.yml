name: CI & Production Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
  AUTH_SECRET: build-check-secret-not-for-production-1234567890
  APP_URL: http://localhost:3000
  ADMIN_EMAIL: keksakademi@gmail.com
  REPORT_RECIPIENT: keksakademi@gmail.com
  PAYTR_TEST_MODE: "1"

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate
      - run: npx tsc --noEmit

  unit:
    name: Unit & Coverage
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate
      - run: npm run test:coverage

  integration:
    name: Integration / PostgreSQL
    needs: unit
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://keks:keks@localhost:5433/keks_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: keks
          POSTGRES_PASSWORD: keks
          POSTGRES_DB: keks_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U keks -d keks_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate
      - run: npm run test:integration

  build:
    name: Production Build
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate
      - run: npm run build

  approve-production:
    name: Approve Production Deploy
    needs: build
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !startsWith(github.event.head_commit.message, 'ci: deploy approved ')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create CI-approved deployment marker
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          printf 'KEKS production release trigger\n\nCI-approved source: %s\nApproved at (UTC): %s\nQuality gate: TypeScript PASS | Unit/Coverage PASS | Integration PASS | Build PASS\n' "$SOURCE_SHA" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > deploy-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy-trigger.txt
          git commit -m "ci: deploy approved $SOURCE_SHA [skip ci]"
          git push origin HEAD:main
