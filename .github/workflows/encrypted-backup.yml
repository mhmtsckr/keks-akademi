name: Encrypted database backup
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    if: ${{ vars.BACKUP_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client gnupg
      - name: Dump and encrypt
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL" && test -n "$BACKUP_PASSPHRASE"
          filename="keks-$(date -u +%Y%m%d)-${GITHUB_RUN_ID}.dump.gpg"
          pg_dump --format=custom --no-owner --no-acl "$DATABASE_URL" | gpg --batch --yes --symmetric --cipher-algo AES256 --pinentry-mode loopback --passphrase-fd 3 --output "$filename" 3<<<"$BACKUP_PASSPHRASE"
          gpg --batch --decrypt --pinentry-mode loopback --passphrase-fd 3 "$filename" 3<<<"$BACKUP_PASSPHRASE" | pg_restore --list > /dev/null
          echo "BACKUP_FILE=$filename" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_FILE }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30
          if-no-files-found: error
      - name: Record successful backup
        env:
          BACKUP_STATUS_SECRET: ${{ secrets.BACKUP_STATUS_SECRET }}
          BACKUP_STATUS_URL: ${{ vars.BACKUP_STATUS_URL }}
        run: |
          set -euo pipefail
          test -n "$BACKUP_STATUS_SECRET" && test -n "$BACKUP_STATUS_URL"
          curl --fail --silent --show-error --retry 3 -X POST "$BACKUP_STATUS_URL" -H "Authorization: Bearer $BACKUP_STATUS_SECRET" -H 'Content-Type: application/json' --data "{\"fileName\":\"$BACKUP_FILE\",\"runId\":\"$GITHUB_RUN_ID\"}"
