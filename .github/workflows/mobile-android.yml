name: Android Native Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'public/keks-logo-mask.svg'
      - 'public/keks-official-2026.webp'
      - 'scripts/generate_android_icons.py'
      - '.github/workflows/mobile-android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'public/keks-logo-mask.svg'
      - 'public/keks-official-2026.webp'
      - 'scripts/generate_android_icons.py'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mobile-android.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - name: Provide a local Capacitor webDir
        run: |
          mkdir -p out
          printf '%s\n' '<!doctype html><html lang="tr"><head><meta charset="utf-8"></head><body>KEKS Akademi</body></html>' > out/index.html
      - name: Create Capacitor Android project
        run: npx cap add android
      - name: Sync Capacitor Android project
        run: npx cap sync android
      - name: Install image processing dependency
        run: python -m pip install --quiet Pillow cairosvg
      - name: Install approved KEKS Android launcher icons
        run: python scripts/generate_android_icons.py
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: keks-akademi-android-debug-transparent-emblem
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            resources/icon.png
          if-no-files-found: error
